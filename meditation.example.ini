# 打坐倒计时小窗的配置示例。
# 把这个文件复制成 meditation.ini 放在 exe 旁边即可生效；
# 也可以在右键菜单里改，程序会自动写回 meditation.ini。

# 背景透明度 0~1：0 = 全透明（只剩下数字），1 = 完全不透明
opacity=0.85

# 字号（像素）：0 = 跟着窗口高度自动缩放
font_px=0

# 文字颜色，#rrggbb
text_color=#ffffff

# 描边：auto = 跟文字反色 / none = 不描边 / #rrggbb = 固定颜色
outline=auto

# 时间格式：seconds = 只显示剩余秒数（180），clock = 分:秒（03:00）
time_format=seconds

# 倒计时时长（秒）
duration_seconds=180

# 全局快捷键：F9、Ctrl+Alt+F9 之类
hotkey=F5

# 是否置顶
on_top=true

# 锁定：true = 整窗鼠标穿透（像桌面歌词锁定后一样点不到），只能用托盘菜单解锁
locked=false

# 窗口位置与尺寸（逻辑像素）。删掉 x / y 就会回到屏幕上方居中。
x=1788
y=36
width=176
height=54


